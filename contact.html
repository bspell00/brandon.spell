 <div id="nav">

<div id="contact">	
	<header>
		<div class="container">
			<h1 class="reveal">I'm easy to get in touch with! Email me <a href="mailto:bspell00@gmail.com">here,</a> or tell me about your project below.</h1>

			<!-- Handled by functions/api/contact.js (Cloudflare Pages), which redirects back here with ?sent=1 or ?error=… -->
			<p id="enquiry" class="form-status" role="status" hidden></p>
			<form class="reveal" action="/api/contact" method="POST">
				<label>Name
					<input type="text" name="name" autocomplete="name" required>
				</label>
				<label>Email
					<input type="email" name="email" autocomplete="email" required>
				</label>
				<label>Church or organization
					<input type="text" name="organization" autocomplete="organization">
				</label>
				<label>What do you need?
					<select name="project_type">
						<option>Conference or event site</option>
						<option>Church website</option>
						<option>Launch page</option>
						<option>Private event RSVP portal</option>
						<option>Something else</option>
					</select>
				</label>
				<label>Budget
					<select name="budget">
						<option>Not sure yet</option>
						<option>Under $2,000</option>
						<option>$2,000&ndash;$5,000</option>
						<option>$5,000&ndash;$10,000</option>
						<option>$10,000+</option>
					</select>
				</label>
				<label>When do you need it?
					<input type="text" name="timeline">
				</label>
				<label class="full">Tell me about it
					<textarea name="message" rows="5" required></textarea>
				</label>
				<input class="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
				<button type="submit">Send it &rarr;</button>
			</form>
	   </div>
	</header>
</div>

<footer>
  <div class="container">
    <p>I have a passion for patterns and a love for lines.</p>
    <p>Brandon Spell  |  2026</p>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
  // Report the outcome of the enquiry form (see functions/api/contact.js)
  (function () {
    var params = new URLSearchParams(location.search);
    var status = document.getElementById('enquiry');
    var messages = {
      sent: "Thanks — your message is on its way. I'll be in touch soon.",
      invalid: 'Please add your name, a valid email and a message, then send it again.',
      send: "Something went wrong sending that. Please try again, or email me directly."
    };
    var text = params.has('sent') ? messages.sent : messages[params.get('error')];
    if (!text) return;
    status.textContent = text;
    status.classList.toggle('is-error', !params.has('sent'));
    status.hidden = false;
  })();
</script>
